<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code Detective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFE6D2;
    --paper-shadow: #D8CBA9;
    --ink: #241F18;
    --ink-soft: #6b5f4a;
    --red: #A13D2B;
    --brass: #8A6D3B;
    --green: #3F5D3A;
    --line: rgba(36,31,24,0.18);
    --bg: #3B4A3D;
    --pin: #A13D2B;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14181A; --line: rgba(36,31,24,0.22); }
  }
  :root[data-theme="dark"] { --bg: #14181A; --line: rgba(36,31,24,0.22); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.03) 0, transparent 40%),
      radial-gradient(circle at 80% 60%, rgba(255,255,255,0.03) 0, transparent 40%);
    color: var(--ink);
    font-family: 'Courier Prime', 'Courier New', monospace;
    min-height: 100vh;
    padding: 20px 14px 40px;
  }
  h1, h2, .stamp, .display { font-family: 'Special Elite', 'Courier New', monospace; }
  .wrap { max-width: 640px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 18px; }
  header h1 {
    color: #EFE6D2;
    font-size: 1.7rem;
    letter-spacing: 0.5px;
    margin: 6px 0 4px;
  }
  header p {
    color: #C9C2AE;
    font-size: 0.85rem;
    margin: 0;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin: 14px 0 22px;
    color: #EFE6D2;
    font-size: 0.8rem;
  }
  .stats b { display: block; font-size: 1.1rem; color: var(--pin); }

  .pool-note {
    text-align: center;
    color: #9a9481;
    font-size: 0.72rem;
    margin: -14px 0 4px;
  }

  .reset-btn {
    display: block;
    margin: 0 auto 20px;
    background: none;
    border: none;
    color: #9a9481;
    font-family: inherit;
    font-size: 0.72rem;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }
  .reset-btn.hidden { display: none; }

  .board {
    display: grid;
    gap: 12px;
  }
  .tile {
    background: var(--paper);
    border-radius: 3px;
    box-shadow: 0 3px 0 var(--paper-shadow), 0 6px 14px rgba(0,0,0,0.35);
    padding: 14px 16px;
    position: relative;
    cursor: pointer;
    border: none;
    text-align: left;
    font-family: inherit;
    color: var(--ink);
    transition: transform 0.15s ease;
  }
  .tile:active { transform: scale(0.98); }
  .tile .case-no { color: var(--ink-soft); font-size: 0.75rem; letter-spacing: 1px; }
  .tile .case-title { font-family: 'Special Elite', monospace; font-size: 1.05rem; margin-top: 3px; }
  .tile .status {
    position: absolute; top: 12px; right: 12px;
    font-size: 0.65rem; padding: 3px 8px; border-radius: 2px;
    border: 1.5px solid var(--green); color: var(--green);
    transform: rotate(-6deg);
  }
  .tile .status.closed { border-color: var(--red); color: var(--red); }

  .detail { display: none; }
  .detail.active { display: block; }
  .board.hidden { display: none; }
  .pool-note.hidden { display: none; }

  .back-btn {
    background: none; border: none; color: #EFE6D2; font-family: inherit;
    font-size: 0.85rem; margin-bottom: 14px; cursor: pointer; padding: 6px 0;
  }
  .back-btn::before { content: "← "; }

  .file {
    background: var(--paper);
    border-radius: 3px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    padding: 18px 16px 20px;
  }
  .file h2 { font-size: 1.15rem; margin: 4px 0 2px; }
  .file .case-no { color: var(--ink-soft); font-size: 0.75rem; letter-spacing: 1px; }
  .file .brief {
    font-size: 0.85rem; color: var(--ink-soft);
    border-left: 3px solid var(--brass); padding-left: 10px; margin: 14px 0;
  }

  .code {
    background: #E3D8C0;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 8px 0;
    margin: 10px 0 16px;
    overflow-x: auto;
  }
  .code-line {
    display: flex; gap: 10px; padding: 3px 12px;
    cursor: pointer; font-size: 0.82rem; line-height: 1.5;
  }
  .code-line:hover { background: rgba(161,61,43,0.08); }
  .code-line.selected { background: rgba(161,61,43,0.16); border-left: 3px solid var(--red); padding-left: 9px; }
  .code-line .num { color: var(--ink-soft); min-width: 1.3em; text-align: right; user-select: none; }
  .code-line .txt { white-space: pre; }

  .hint { font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 12px; }

  button.submit {
    background: var(--red); color: #EFE6D2; border: none;
    font-family: 'Special Elite', monospace; font-size: 0.9rem;
    padding: 10px 18px; border-radius: 2px; cursor: pointer; width: 100%;
  }
  button.submit:disabled { background: #b7ae98; cursor: not-allowed; }

  .verdict { margin-top: 16px; padding: 14px; border-radius: 3px; display: none; }
  .verdict.show { display: block; }
  .verdict.correct { background: rgba(63,93,58,0.12); border: 1.5px dashed var(--green); }
  .verdict.wrong { background: rgba(161,61,43,0.1); border: 1.5px dashed var(--red); }
  .stamp {
    font-size: 1.1rem; letter-spacing: 1px; margin-bottom: 6px;
    transform: rotate(-3deg); display: inline-block;
  }
  .verdict.correct .stamp { color: var(--green); }
  .verdict.wrong .stamp { color: var(--red); }
  .verdict p { font-size: 0.85rem; margin: 6px 0; color: var(--ink); }
  .fix-line {
    background: rgba(63,93,58,0.15); border-left: 3px solid var(--green);
    padding: 4px 10px; font-size: 0.82rem; white-space: pre; overflow-x: auto; margin-top: 8px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔍 Code Detective</h1>
    <p>Every case starts with one buggy line of Python. Find it.</p>
  </header>

  <div class="stats">
    <div><b id="xpVal">0</b>XP</div>
    <div><b id="streakVal">0</b>Streak</div>
    <div><b id="closedVal">0/5</b>Closed</div>
  </div>
  <div class="pool-note" id="poolNote"></div>
  <button class="reset-btn" id="resetBtn">Reset progress</button>

  <main id="board" class="board"></main>

  <div id="detail" class="detail">
    <button class="back-btn" id="backBtn">Case board</button>
    <div class="file">
      <div class="case-no" id="dCaseNo"></div>
      <h2 id="dTitle"></h2>
      <div class="brief" id="dBrief"></div>
      <div class="code" id="dCode"></div>
      <div class="hint">Tap the line that's the root cause of the bug, then close the case.</div>
      <button class="submit" id="submitBtn" disabled>Close the case</button>
      <div class="verdict" id="verdict"></div>
    </div>
  </div>
</div>

<script>
const CASES = [
  {
    id: 1, title: "The Vanishing First Suspect",
    brief: "A function totals up a list of scores. Every result comes back too low.",
    lines: [
      "def total_score(scores):",
      "    total = 0",
      "    for i in range(1, len(scores)):",
      "        total += scores[i]",
      "    return total"
    ],
    suspect: 3,
    explanation: "range(1, len(scores)) starts counting at index 1, so scores[0] never gets added to the total. The loop needs to start at 0.",
    fixedLine: "    for i in range(len(scores)):"
  },
  {
    id: 2, title: "The Silent Function",
    brief: "A function doubles a number. Printing the result shows None instead.",
    lines: [
      "def double(n):",
      "    result = n * 2",
      "print(double(5))"
    ],
    suspect: 2,
    explanation: "The function calculates result but never returns it. Without a return statement, double(5) hands back None instead of 10.",
    fixedLine: "    return result"
  },
  {
    id: 3, title: "The Case of the Growing Cart",
    brief: "A shopping cart function keeps remembering items from previous, unrelated calls.",
    lines: [
      "def add_item(item, cart=[]):",
      "    cart.append(item)",
      "    return cart"
    ],
    suspect: 1,
    explanation: "Default arguments are created once, when the function is defined, not each time it's called. Every call that skips cart shares that same list, so items pile up across calls.",
    fixedLine: "def add_item(item, cart=None):"
  },
  {
    id: 4, title: "The Short-Changed Average",
    brief: "An averaging function always rounds down, never matching the expected result.",
    lines: [
      "def average(numbers):",
      "    total = sum(numbers)",
      "    return total // len(numbers)"
    ],
    suspect: 3,
    explanation: "// is floor division, it throws away the decimal part. average([1, 2, 4]) should be 2.33, but // forces it down to 2.",
    fixedLine: "    return total / len(numbers)"
  },
  {
    id: 5, title: "The Untrustworthy Input",
    brief: "An age check crashes the program every single time it runs.",
    lines: [
      "age = input(\"Enter your age: \")",
      "if age >= 18:",
      "    print(\"Access granted\")",
      "else:",
      "    print(\"Access denied\")"
    ],
    suspect: 1,
    explanation: "input() always returns a string, even when the user types digits. Comparing a string to the int 18 with >= crashes the program; the value needs to be converted first.",
    fixedLine: "age = int(input(\"Enter your age: \"))"
  },
  {
    id: 6, title: "The Last One Standing",
    brief: "A function prints a list of items. The final item on the list never shows up.",
    lines: [
      "def print_all(items):",
      "    for i in range(0, len(items) - 1):",
      "        print(items[i])"
    ],
    suspect: 2,
    explanation: "range(0, len(items) - 1) stops one short of the end, so the last item in the list never gets printed.",
    fixedLine: "    for i in range(len(items)):"
  },
  {
    id: 7, title: "The Copycat List",
    brief: "A list is backed up before editing. Somehow the original changes too.",
    lines: [
      "original = [1, 2, 3]",
      "backup = original",
      "backup.append(4)",
      "print(original)"
    ],
    suspect: 2,
    explanation: "backup = original doesn't create a new list, it just gives the same list a second name. Appending to backup changes original too.",
    fixedLine: "backup = original.copy()"
  },
  {
    id: 8, title: "The Impossible Equality",
    brief: "A total that should clearly equal 0.3 refuses to match in the if check.",
    lines: [
      "total = 0.1 + 0.2",
      "if total == 0.3:",
      "    print(\"Matched\")",
      "else:",
      "    print(\"No match\")"
    ],
    suspect: 2,
    explanation: "Floating point numbers can't represent 0.1 and 0.2 exactly, so their sum is really 0.30000000000000004. Comparing floats with == is unreliable.",
    fixedLine: "if abs(total - 0.3) < 1e-9:"
  },
  {
    id: 9, title: "The Loop That Never Ends",
    brief: "A counting loop is supposed to stop at 5. The program hangs forever instead.",
    lines: [
      "count = 0",
      "while count < 5:",
      "    print(\"Counting:\", count)",
      "count += 1"
    ],
    suspect: 4,
    explanation: "count += 1 isn't indented, so it sits outside the while block. The loop body never changes count, so the condition count < 5 never becomes false.",
    fixedLine: "    count += 1"
  },
  {
    id: 10, title: "The Wrong Key",
    brief: "A dictionary lookup crashes with a KeyError, even though the key is right there.",
    lines: [
      "user = {\"Name\": \"Ada\", \"age\": 30}",
      "print(user[\"name\"])"
    ],
    suspect: 2,
    explanation: "Dictionary keys are case-sensitive. The key was stored as \"Name\" with a capital N, so looking it up as \"name\" raises a KeyError.",
    fixedLine: "print(user[\"Name\"])"
  },
  {
    id: 11, title: "The Shadowed Builtin",
    brief: "A perfectly normal-looking script crashes on a line that calls list().",
    lines: [
      "list = [1, 2, 3]",
      "numbers = list(range(5))",
      "print(numbers)"
    ],
    suspect: 1,
    explanation: "Naming a variable list overwrites Python's built-in list() function. The next line tries to call list(...) as a function, but it's now just an array.",
    fixedLine: "items = [1, 2, 3]"
  },
  {
    id: 12, title: "The Global Mixup",
    brief: "A withdraw function crashes with an UnboundLocalError before it does any math.",
    lines: [
      "balance = 100",
      "def withdraw(amount):",
      "    balance = balance - amount",
      "    return balance",
      "print(withdraw(30))"
    ],
    suspect: 3,
    explanation: "Assigning to balance inside the function makes Python treat it as a new local variable for the whole function, so the right-hand side reads it before it exists.",
    fixedLine: "    return balance - amount"
  },
  {
    id: 13, title: "The Off-By-One Dice",
    brief: "A six-sided die simulator occasionally rolls a number that shouldn't exist.",
    lines: [
      "import random",
      "dice_roll = random.randint(1, 7)",
      "print(dice_roll)"
    ],
    suspect: 2,
    explanation: "random.randint(a, b) includes both endpoints. A six-sided die only has faces 1 through 6, but this can roll a 7.",
    fixedLine: "dice_roll = random.randint(1, 6)"
  },
  {
    id: 14, title: "The Silent Except",
    brief: "A calculation quietly fails and the program crashes later with no clue why.",
    lines: [
      "try:",
      "    result = 10 / 0",
      "except:",
      "    pass",
      "print(result)"
    ],
    suspect: 3,
    explanation: "except: pass catches every error and throws it away with no trace. The real ZeroDivisionError gets buried here, so result never gets created, and the crash shows up later somewhere confusing.",
    fixedLine: "except ZeroDivisionError as e:"
  },
  {
    id: 15, title: "The Copy-Paste Loop",
    brief: "A nested loop's outer count always prints the same wrong number.",
    lines: [
      "for i in range(3):",
      "    for i in range(3):",
      "        print(i)",
      "    print(\"Outer:\", i)"
    ],
    suspect: 2,
    explanation: "The inner loop reuses the same variable name i as the outer loop. By the time the outer print runs, i has been overwritten by the inner loop.",
    fixedLine: "    for j in range(3):"
  }
];

function shuffleAndPick(pool, n) {
  const arr = pool.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr.slice(0, n);
}

const boardCases = shuffleAndPick(CASES, 5);

let state = { xp: 0, streak: 0, solved: {} };
try {
  const saved = localStorage.getItem('code-detective-state');
  if (saved) state = JSON.parse(saved);
} catch (e) { /* fresh start */ }

let currentCase = null;
let selectedLine = null;
let attempts = 0;

function caseNo(id) { return 'CASE #' + String(id).padStart(3, '0'); }

function save() {
  try { localStorage.setItem('code-detective-state', JSON.stringify(state)); } catch (e) {}
}

function renderStats() {
  document.getElementById('xpVal').textContent = state.xp;
  document.getElementById('streakVal').textContent = state.streak;
  const closed = boardCases.filter(c => state.solved[c.id]).length;
  document.getElementById('closedVal').textContent = closed + '/' + boardCases.length;
  document.getElementById('poolNote').textContent =
    'Today\'s 5 cases, pulled from a file of ' + CASES.length + '. Reopen for a new set.';
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  boardCases.forEach(c => {
    const closed = state.solved[c.id];
    const tile = document.createElement('button');
    tile.className = 'tile';
    tile.innerHTML = `
      <div class="case-no">${caseNo(c.id)}</div>
      <div class="case-title">${c.title}</div>
      <div class="status ${closed ? 'closed' : ''}">${closed ? 'CLOSED' : 'OPEN'}</div>
    `;
    tile.addEventListener('click', () => openCase(c.id));
    board.appendChild(tile);
  });
  renderStats();
}

function openCase(id) {
  currentCase = CASES.find(c => c.id === id);
  selectedLine = null;
  attempts = 0;
  document.getElementById('board').classList.add('hidden');
  document.getElementById('poolNote').classList.add('hidden');
  document.getElementById('resetBtn').classList.add('hidden');
  document.getElementById('detail').classList.add('active');
  document.getElementById('dCaseNo').textContent = caseNo(currentCase.id);
  document.getElementById('dTitle').textContent = currentCase.title;
  document.getElementById('dBrief').textContent = currentCase.brief;
  const codeEl = document.getElementById('dCode');
  codeEl.innerHTML = '';
  currentCase.lines.forEach((txt, idx) => {
    const row = document.createElement('div');
    row.className = 'code-line';
    row.dataset.line = idx + 1;
    row.innerHTML = `<span class="num">${idx + 1}</span><span class="txt"></span>`;
    row.querySelector('.txt').textContent = txt;
    row.addEventListener('click', () => selectLine(idx + 1));
    codeEl.appendChild(row);
  });
  const verdict = document.getElementById('verdict');
  verdict.className = 'verdict';
  verdict.innerHTML = '';
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Close the case';

  if (state.solved[currentCase.id]) {
    showVerdict(true, true);
  }
}

function selectLine(n) {
  if (currentCase && state.solved[currentCase.id]) return;
  selectedLine = n;
  document.querySelectorAll('.code-line').forEach(el => {
    el.classList.toggle('selected', Number(el.dataset.line) === n);
  });
  document.getElementById('submitBtn').disabled = false;
}

function showVerdict(correct, alreadySolved) {
  const verdict = document.getElementById('verdict');
  verdict.classList.add('show');
  if (correct) {
    verdict.classList.remove('wrong');
    verdict.classList.add('correct');
    verdict.innerHTML = `
      <div class="stamp">CASE CLOSED</div>
      <p>${currentCase.explanation}</p>
      <div class="fix-line">${currentCase.fixedLine}</div>
    `;
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('submitBtn').textContent = 'Case closed';
  } else {
    verdict.classList.remove('correct');
    verdict.classList.add('wrong');
    verdict.innerHTML = `<div class="stamp">WRONG LEAD</div><p>That line runs fine on its own. Look again.</p>`;
  }
}

document.getElementById('submitBtn').addEventListener('click', () => {
  if (!selectedLine || !currentCase) return;
  if (selectedLine === currentCase.suspect) {
    const firstTry = attempts === 0;
    if (!state.solved[currentCase.id]) {
      state.xp += firstTry ? 20 : 10;
      state.streak = firstTry ? state.streak + 1 : 0;
      state.solved[currentCase.id] = true;
      save();
    }
    showVerdict(true, false);
  } else {
    attempts++;
    if (state.solved[currentCase.id] === undefined) state.streak = 0;
    save();
    showVerdict(false);
  }
});

document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('detail').classList.remove('active');
  document.getElementById('board').classList.remove('hidden');
  document.getElementById('poolNote').classList.remove('hidden');
  document.getElementById('resetBtn').classList.remove('hidden');
  renderBoard();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  const btn = document.getElementById('resetBtn');
  if (btn.dataset.armed === 'true') {
    state = { xp: 0, streak: 0, solved: {} };
    save();
    btn.dataset.armed = 'false';
    btn.textContent = 'Reset progress';
    renderBoard();
  } else {
    btn.dataset.armed = 'true';
    btn.textContent = 'Tap again to confirm';
    setTimeout(() => {
      if (btn.dataset.armed === 'true') {
        btn.dataset.armed = 'false';
        btn.textContent = 'Reset progress';
      }
    }, 3000);
  }
});

renderBoard();
</script>
</body>
</html>
